    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(315.348844 119.155955)">Candidate index = original j</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(582.289063 94.532802)">Next n query tokens</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(581.8925 106.844379)">Type flags, position i</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(570.514828 119.155955)">No key or answer feature</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(833.339672 94.402083)">Dynamic pointer head</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(825.930563 106.71366)">score(i,j) = Q_i dot K_j / 8</text>
